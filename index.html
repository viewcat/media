<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Video Archive</title>
    <style>
        body { font-family: sans-serif; max-width: 900px; margin: 0 auto; padding: 20px; background: #f9f9f9; }
        .category { margin-bottom: 40px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; }
        .video-card { background: white; border: 1px solid #ddd; padding: 10px; border-radius: 6px; }
        video { width: 100%; height: auto; border-radius: 4px; }
        h3 { margin-top: 5px; font-size: 1rem; color: #333; }
    </style>
</head>
<body>

    <h1>Project Video Archive</h1>

    <!-- Subdirectory 1: Category Alpha -->
    <div class="category">
        <h2>Category Alpha</h2>
        <div class="grid">
            <div class="video-card">
                <video controls preload="metadata">
                    <source src="category-alpha/video1.mp4" type="video/mp4">
                    Your browser does not support the video tag.
                </video>
                <h3>Video 1 Title</h3>
            </div>
            <div class="video-card">
                <video controls preload="metadata">
                    <source src="category-alpha/video2.mov" type="video/quicktime">
                    Your browser does not support the video tag.
                </video>
                <h3>Video 2 Title</h3>
            </div>
        </div>
    </div>

    <!-- Subdirectory 2: Category Beta -->
    <div class="category">
        <h2>Category Beta</h2>
        <div class="grid">
            <div class="video-card">
                <video controls preload="metadata">
                    <source src="category-beta/video3.mp4" type="video/mp4">
                </video>
                <h3>Video 3 Title</h3>
            </div>
        </div>
    </div>

</body>
</html>
